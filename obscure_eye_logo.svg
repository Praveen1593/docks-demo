<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylized Eye Outline -->
  <path d="M30 100 Q100 30 170 100 Q100 170 30 100 Z" fill="#181c2f" stroke="#00b0ff" stroke-width="6"/>
  <!-- Glowing Gradient Iris -->
  <defs>
    <radialGradient id="irisGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff90"/>
      <stop offset="60%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#181c2f"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="32" fill="url(#irisGradient)" stroke="#00ff90" stroke-width="3"/>
  <!-- Central AI/Power Symbol -->
  <circle cx="100" cy="100" r="12" fill="#fff" stroke="#00b0ff" stroke-width="2"/>
  <rect x="97" y="90" width="6" height="20" rx="3" fill="#00b0ff"/>
  <rect x="90" y="97" width="20" height="6" rx="3" fill="#00b0ff"/>
  <!-- Pupil Highlight -->
  <ellipse cx="108" cy="94" rx="4" ry="2" fill="#fff" opacity="0.7"/>
  <!-- Digital Pixel Accents -->
  <rect x="155" y="95" width="6" height="6" fill="#00ff90"/>
  <rect x="160" y="105" width="4" height="4" fill="#00b0ff"/>
  <rect x="40" y="110" width="5" height="5" fill="#00ff90"/>
  <rect x="45" y="90" width="3" height="3" fill="#00b0ff"/>
</svg>